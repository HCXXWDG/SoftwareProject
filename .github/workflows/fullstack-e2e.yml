name: Full-stack E2E

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Optional full backend commit SHA for frontend-only stacked PR acceptance
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fullstack-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fullstack-e2e:
    name: Full-stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate requested backend revision
        if: inputs.backend_ref != ''
        env:
          BACKEND_REF: ${{ inputs.backend_ref }}
        run: |
          if [[ ! "$BACKEND_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "backend_ref must be a full commit SHA from this repository."
            exit 1
          fi

      - name: Checkout requested backend fixture
        if: inputs.backend_ref != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.backend_ref }}
          path: .tmp/fullstack-backend
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start demo backend
        working-directory: ${{ inputs.backend_ref != '' && '.tmp/fullstack-backend/backend' || 'backend' }}
        env:
          SPRING_PROFILES_ACTIVE: demo
          AMAP_WEB_KEY: ""
          ROUTE_DEMO_ENABLED: "true"
          APP_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
        run: |
          git rev-parse HEAD
          chmod +x mvnw
          nohup ./mvnw --batch-mode --no-transfer-progress spring-boot:run \
            > "$GITHUB_WORKSPACE/backend-demo.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/backend-demo.pid"

      - name: Wait for backend health
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/actuator/health \
              | grep --quiet '"status":"UP"'; then
              exit 0
            fi
            sleep 2
          done
          cat backend-demo.log
          exit 1

      - name: Run full-stack end-to-end tests
        working-directory: frontend
        run: npm run test:e2e:integration

      - name: Upload full-stack diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fullstack-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-report/integration/
            frontend/test-results/integration/
            backend-demo.log
          if-no-files-found: warn
          retention-days: 14
