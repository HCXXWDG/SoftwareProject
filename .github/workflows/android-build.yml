name: Android Build CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Verify versionCode and versionName
        working-directory: frontend/android
        run: |
          VERSION_CODE=$(grep -oP 'versionCode\s+\K\d+' app/build.gradle)
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "::error::versionCode or versionName is missing in app/build.gradle"
            exit 1
          fi
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env.production for Android build
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://10.0.2.2:8080' }}" > .env.production
          if [ -n "${{ secrets.VITE_AMAP_JS_KEY }}" ]; then
            echo "VITE_AMAP_JS_KEY=${{ secrets.VITE_AMAP_JS_KEY }}" >> .env.production
          fi
          if [ -n "${{ secrets.VITE_AMAP_SECURITY_CODE }}" ]; then
            echo "VITE_AMAP_SECURITY_CODE=${{ secrets.VITE_AMAP_SECURITY_CODE }}" >> .env.production
          fi
          echo "=== .env.production (secrets masked) ==="
          cat .env.production | sed 's/\(VITE_AMAP_JS_KEY=\).*/\1***masked***/; s/\(VITE_AMAP_SECURITY_CODE=\).*/\1***masked***/'

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Configure local.properties
        working-directory: frontend/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ github.run_id }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # ── Release build with CI-generated keystore ──
      - name: Generate CI keystore for release signing
        run: |
          keytool -genkeypair -v             -storetype PKCS12             -keystore $RUNNER_TEMP/ci-release.keystore             -alias ci-release             -keyalg RSA -keysize 2048 -validity 10000             -storepass android-ci-pass             -keypass android-ci-pass             -dname "CN=CI Build, OU=DevOps, O=CommuteMoodMap, L=WX, ST=JS, C=CN"

      - name: Write keystore.properties
        working-directory: frontend/android
        run: |
          echo "storeFile=$RUNNER_TEMP/ci-release.keystore" > keystore.properties
          echo "storePassword=android-ci-pass" >> keystore.properties
          echo "keyAlias=ci-release" >> keystore.properties
          echo "keyPassword=android-ci-pass" >> keystore.properties

      - name: Build Android release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-release-apk-${{ github.run_id }}
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        working-directory: frontend/android
        run: ./gradlew lint --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-${{ github.run_id }}
          path: frontend/android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  android-apk-verify:
    name: Android APK Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Create .env.production for Android build
        working-directory: frontend
        run: |
          echo "VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://10.0.2.2:8080' }}" > .env.production

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Configure local.properties
        working-directory: frontend/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK structure and manifest
        run: |
          APK="frontend/android/app/build/outputs/apk/debug/app-debug.apk"

          echo "=== Verifying APK exists ==="
          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK not found at $APK"
            exit 1
          fi
          echo "APK size: $(du -h "$APK" | cut -f1)"

          echo "=== Verifying APK is valid ZIP ==="
          unzip -t "$APK" > /dev/null 2>&1
          if [ $? -ne 0 ]; then
            echo "::error::APK is not a valid ZIP archive"
            exit 1
          fi

          echo "=== Verifying AndroidManifest.xml ==="
          # Use aapt2 to dump the manifest
          AAPT2=$(find $ANDROID_HOME/build-tools -name "aapt2" | head -1)
          MANIFEST=$($AAPT2 dump xmltree --file AndroidManifest.xml "$APK" 2>&1)

          # Check for required elements
          if echo "$MANIFEST" | grep -q "com.jiangnan.course.commutemoodmap"; then
            echo "Package name verified"
          else
            echo "::error::Package name not found in manifest"
            exit 1
          fi

          if echo "$MANIFEST" | grep -q "MainActivity"; then
            echo "MainActivity verified"
          else
            echo "::error::MainActivity not found in manifest"
            exit 1
          fi

          if echo "$MANIFEST" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission verified"
          else
            echo "::warning::INTERNET permission not found in manifest"
          fi

          echo "=== Verifying web assets in APK ==="
          if unzip -l "$APK" | grep -q "assets/public/index.html"; then
            echo "Web assets (index.html) verified"
          else
            echo "::error::Web assets not found in APK"
            exit 1
          fi

          echo "=== All APK verification checks passed ==="

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-verify-${{ github.run_id }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
