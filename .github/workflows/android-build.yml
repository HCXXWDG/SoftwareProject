name: Android Build CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" --channel=3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Configure local.properties
        working-directory: frontend/android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk-${{ github.run_id }}
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Run Android lint
        working-directory: frontend/android
        run: ./gradlew lint --no-daemon || true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-${{ github.run_id }}
          path: frontend/android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
