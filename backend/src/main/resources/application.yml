spring:
  application:
    name: commute-mood-api
  profiles:
    default: demo
  datasource:
    url: jdbc:h2:mem:commute;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  info:
    env:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

info:
  app:
    name: ${spring.application.name}
    version: 1.0.0
    mode: ${spring.profiles.active:${spring.profiles.default}}
    description: Commute mood map backend API

app:
  device-hash-salt: ${DEVICE_HASH_SALT:local-demo-salt-change-before-deploy}
  amap:
    web-key: ${AMAP_WEB_KEY:}
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost,https://localhost}

